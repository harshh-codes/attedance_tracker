name: CI/CD Pipeline - Landmark Developers Attendance System

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: landmark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Backend - Install Dependencies & Generate Prisma
        run: |
          cd backend
          npm ci
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/landmark_test?schema=public

      - name: Frontend - Install Dependencies & Build Bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Docker Container Images
        run: |
          docker build -t landmark-backend:latest ./backend
          docker build -t landmark-frontend:latest ./frontend
